name: Keep Render App Awake

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping app to keep it awake
        run: |
          echo "Pinging https://lawbot-kqqb.onrender.com at $(date)"
          curl --fail --silent --show-error --max-time 30 \
            https://lawbot-kqqb.onrender.com